name: Cheeta
type: drupal10
docroot: web
php_version: "8.1"
webserver_type: nginx-fpm
xdebug_enabled: false
additional_hostnames: []
additional_fqdns: []
database:
    type: mysql
    version: "5.7"
use_dns_when_possible: true
composer_version: "2.6"
web_environment: []
nodejs_version: "18"
hooks:
    post-start:
        - exec: |
              sed -i "s/\$settings\['config_sync_directory'\] = 'sites\/default\/files\/sync';/\$settings\['config_sync_directory'\] = '..\/config\/sync';/" web/sites/default/settings.ddev.php
        - exec: chmod +x .ddev/solr/docker-entrypoint-initdb.d/solr-configupdate.sh
        - composer: install

